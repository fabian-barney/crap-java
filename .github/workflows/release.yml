name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Record release metadata
        id: release
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN_PASSWORD

      - name: Set up Gradle wrapper permissions
        run: chmod +x gradle-plugin/gradlew

      - name: Verify release version
        shell: bash
        run: bash ./.github/scripts/verify-version-alignment.sh --expected-version "${GITHUB_REF_NAME#v}"

      - name: Normalize and import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: bash ./.github/scripts/import-release-gpg-key.sh

      - name: Validate Maven release artifacts
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -B -ntp -P!quality-gates-all,release
          -Dcentral.skipPublishing=true
          "-Dproject.build.outputTimestamp=${SOURCE_DATE_EPOCH}"
          -pl .,cli,maven-plugin -am deploy

      - name: Build and sign release assets
        shell: bash
        env:
          RELEASE_SIGNING_FINGERPRINT: E6BB1FB6EE83EEAB7B408C6B5CA409BD8EE61724
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir -p target/release-assets
          bash .github/scripts/build-release-payloads.sh target/release-assets
          bash .github/scripts/sign-release-assets.sh target/release-assets
          bash .github/scripts/verify-release-assets.sh target/release-assets \
            "${{ steps.release.outputs.version }}"

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            $1 == "##" && $2 == version {
              found = 1
            }
            found {
              if ($1 == "##" && $2 != version) {
                exit
              }
              print
            }
            END {
              if (!found) {
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            if [ "${is_draft}" != "true" ]; then
              echo "GitHub release ${GITHUB_REF_NAME} already exists and is not a draft." >&2
              exit 1
            fi
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --draft
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --draft --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi

      - name: Publish Maven artifacts
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -B -ntp -P!quality-gates-all,release
          "-Dproject.build.outputTimestamp=${SOURCE_DATE_EPOCH}"
          -pl .,cli,maven-plugin -am deploy

      - name: Publish Gradle plugin artifacts to Maven Central
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        working-directory: gradle-plugin
        run: ./gradlew publishAllPublicationsToCentralPortalOssrhStagingRepository

      - name: Finalize Gradle plugin Maven Central deployment
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        shell: bash
        run: |
          auth="$(printf '%s:%s' "${MAVEN_CENTRAL_TOKEN_USERNAME}" "${MAVEN_CENTRAL_TOKEN_PASSWORD}" | base64 -w 0)"
          echo "::add-mask::${auth}"
          curl --fail --request POST \
            --header "Authorization: Bearer ${auth}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/media.barney?publishing_type=automatic"

      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        working-directory: gradle-plugin
        run: ./gradlew publishPlugins -Pgradle.publish.key="${GRADLE_PUBLISH_KEY}" -Pgradle.publish.secret="${GRADLE_PUBLISH_SECRET}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            core/target/crap-java-core-${{ steps.release.outputs.version }}.jar
            target/release-assets/crap-java-${{ steps.release.outputs.version }}.jar
            maven-plugin/target/crap-java-maven-plugin-${{ steps.release.outputs.version }}.jar
            gradle-plugin/build/libs/crap-java-gradle-plugin-${{ steps.release.outputs.version }}.jar

      - name: Attest core SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: core/target/crap-java-core-${{ steps.release.outputs.version }}.jar
          sbom-path: target/release-assets/crap-java-core-${{ steps.release.outputs.version }}.cdx.json

      - name: Attest CLI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/release-assets/crap-java-${{ steps.release.outputs.version }}.jar
          sbom-path: target/release-assets/crap-java-cli-${{ steps.release.outputs.version }}.cdx.json

      - name: Attest Maven plugin SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: maven-plugin/target/crap-java-maven-plugin-${{ steps.release.outputs.version }}.jar
          sbom-path: target/release-assets/crap-java-maven-plugin-${{ steps.release.outputs.version }}.cdx.json

      - name: Attest Gradle plugin SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: gradle-plugin/build/libs/crap-java-gradle-plugin-${{ steps.release.outputs.version }}.jar
          sbom-path: target/release-assets/crap-java-gradle-plugin-${{ steps.release.outputs.version }}.cdx.json

      - name: Upload signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" target/release-assets/* --clobber

      - name: Verify release assets and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          verification_root="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" --dir "$verification_root"
          diff --recursive --brief target/release-assets "$verification_root"
          for subject in \
            "core/target/crap-java-core-${{ steps.release.outputs.version }}.jar" \
            "target/release-assets/crap-java-${{ steps.release.outputs.version }}.jar" \
            "maven-plugin/target/crap-java-maven-plugin-${{ steps.release.outputs.version }}.jar" \
            "gradle-plugin/build/libs/crap-java-gradle-plugin-${{ steps.release.outputs.version }}.jar"; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://cyclonedx.org/bom
          done

      - name: Verify public registries
        shell: bash
        run: bash .github/scripts/verify-publication.sh "${{ steps.release.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

      - name: Clean up imported GPG home
        if: always()
        shell: bash
        run: |
          if [ -n "${IMPORTED_GNUPGHOME:-}" ] && [ -d "${IMPORTED_GNUPGHOME}" ] \
            && [ -n "${IMPORTED_GNUPGHOME_MARKER_PATH:-}" ] \
            && [[ "${IMPORTED_GNUPGHOME_MARKER_PATH}" == "${IMPORTED_GNUPGHOME}/"* ]] \
            && [ -f "${IMPORTED_GNUPGHOME_MARKER_PATH}" ]; then
            rm -rf "${IMPORTED_GNUPGHOME}"
          fi
