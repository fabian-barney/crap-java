      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
