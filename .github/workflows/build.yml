name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: verify / Gradle wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -ntp -P!quality-gates-all -DskipTests install

      - name: Prime Maven test cache
        run: |
          mvn -B -ntp -P!quality-gates-all,quality-gate-spotbugs -DskipTests -DincludePluginDependencies=true org.apache.maven.plugins:maven-dependency-plugin:3.7.0:go-offline
          junit_version="$(mvn -B -ntp -N -P!quality-gates-all help:evaluate -Dexpression=junit.version -q -DforceStdout | tail -n 1)"
          surefire_version="$(mvn -B -ntp -N -P!quality-gates-all help:evaluate -Dexpression=maven.surefire.plugin.version -q -DforceStdout | tail -n 1)"
          for version_variable in junit_version surefire_version; do
            resolved_version="${!version_variable}"
            if [[ -z "${resolved_version}" || "${resolved_version}" == null* || "${resolved_version}" == *[[:space:]]* ]]; then
              echo "::error::Maven property evaluation returned an invalid ${version_variable}: '${resolved_version}'" >&2
              exit 1
            fi
          done
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.7.0:get -Dartifact="org.junit.platform:junit-platform-engine:${junit_version}" -Dtransitive=true
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.7.0:get -Dartifact="org.junit.platform:junit-platform-launcher:${junit_version}" -Dtransitive=true
          mvn -B -ntp -N -P!quality-gates-all org.apache.maven.plugins:maven-dependency-plugin:3.7.0:get -Dartifact="org.apache.maven.surefire:surefire-junit-platform:${surefire_version}" -Dtransitive=true

      - name: Upload Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-repository
          path: ~/.m2/repository
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run unit tests
        run: mvn -B -ntp -P!quality-gates-all -o verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            core/target/site/jacoco
            cli/target/site/jacoco
            gradle-plugin/target/site/jacoco
            maven-plugin/target/site/jacoco
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Run package build
        run: mvn -B -ntp -P!quality-gates-all -o -DskipTests package

      - name: Build Gradle plugin archive
        working-directory: gradle-plugin
        run: |
          chmod +x gradlew
          ./gradlew jar

      - name: Verify archive legal content
        run: java .github/scripts/VerifyLegalContents.java

  quality-crap-core:
    name: verify / quality-crap-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for core
        working-directory: core
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -DskipTests verify

  quality-crap-cli:
    name: verify / quality-crap-cli
    runs-on: ubuntu-latest
