name: Build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B -ntp -P!quality-gates-all -DskipTests install

      - name: Upload Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository
          if-no-files-found: error

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-targets
          path: |
            core/target
            cli/target
            gradle-plugin/target
            maven-plugin/target
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-targets
          path: .

      - name: Run unit tests
        run: mvn -B -ntp -P!quality-gates-all -o verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            core/target/site/jacoco
            cli/target/site/jacoco
            gradle-plugin/target/site/jacoco
            maven-plugin/target/site/jacoco
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-targets
          path: .

      - name: Run package build
        run: mvn -B -ntp -P!quality-gates-all -o -DskipTests package

  quality-crap-core:
    name: verify / quality-crap-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Maven repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repository
          path: ~/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for core
        working-directory: core
        run: mvn -B -ntp -P!quality-gates-all,quality-gate-crap -o -DskipTests verify

  quality-crap-cli:
